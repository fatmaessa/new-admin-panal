<div class="min-h-screen bg-[#f7f9fb] p-5 md:p-8 lg:p-12" dir="rtl">
  <main class="max-w-5xl mx-auto space-y-8">
    <!-- Header -->
    <header
      class="flex flex-col md:flex-row md:items-center justify-between gap-6 animate-[fadeSlideDown_0.5s_ease_both]"
    >
      <div>
        <h1 class="text-[32px] font-bold leading-[1.4] text-[#0058be] mb-1">إدارة المقالات</h1>
        <p class="text-[18px] font-medium leading-[1.6] text-[#424754]">
          عرض وتعديل كافة المقالات المضافة في المنصة
        </p>
      </div>
      <button
        routerLink="/articles/add"
        class="flex items-center gap-2 px-8 py-3 rounded-xl text-white font-bold text-base bg-gradient-to-l from-[#3B82F6] to-[#60A5FA] shadow-[0_4px_12px_rgba(59,130,246,0.3)] hover:scale-105 active:scale-95 transition-transform duration-200 self-start md:self-auto"
      >
        ➕ إضافة مقالة جديدة
      </button>
    </header>

    <!-- Table -->
    <section class="animate-[fadeSlideUp_0.5s_0.2s_ease_both]">
      <div
        class="bg-white rounded-[24px] shadow-[0_8px_30px_rgba(59,130,246,0.08)] border border-blue-50 overflow-hidden"
      >
        <!-- Table Head -->
        <div
          class="hidden md:grid grid-cols-12 gap-4 px-8 py-5 bg-[#f2f4f6] border-b border-gray-100"
        >
          <div class="col-span-6 text-[#424754] font-bold text-sm">تفاصيل المقالة</div>
          <div class="col-span-3 text-[#424754] font-bold text-sm">الرابط</div>
          <div class="col-span-3 text-[#424754] font-bold text-sm text-center">الإجراءات</div>
        </div>

        <!-- Rows -->
        <div class="divide-y divide-gray-100">
          @for (article of filteredArticles(); track article.id) {
            <div
              class="grid grid-cols-1 md:grid-cols-12 gap-4 px-6 md:px-8 py-6 items-center hover:bg-blue-50/30 transition-colors duration-200"
            >
              <!-- Article Details -->
              <div class="col-span-6 flex items-center gap-4">
                <div
                  class="w-16 h-16 rounded-2xl overflow-hidden shrink-0 bg-gray-100 shadow-inner"
                >
                  <img
                    class="w-full h-full object-cover"
                    [src]="article.imageUrl"
                    [alt]="article.name"
                  />
                </div>
                <div>
                  <a
                    [routerLink]="['/articles', article.id]"
                    class="font-bold text-lg text-[#191c1e] hover:text-[#0058be] transition-colors duration-200 mb-1 block"
                  >
                    {{ article.name }}
                  </a>
                  <p class="text-[#727785] text-sm line-clamp-1">{{ article.description }}</p>
                </div>
              </div>

              <!-- Link -->
              <div class="col-span-3">
                <a
                  [href]="article.link"
                  target="_blank"
                  class="inline-flex items-center gap-1 text-[#0058be] text-sm font-bold hover:underline"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"
                    />
                  </svg>
                  فتح الرابط
                </a>
              </div>

              <!-- Actions -->
              <div class="col-span-3 flex justify-end md:justify-start gap-2">
                <button
                  [routerLink]="['/articles/edit', article.id]"
                  class="p-2 rounded-xl text-[#424754] hover:text-[#0058be] hover:bg-blue-50 border border-transparent hover:border-blue-100 transition-all duration-200"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"
                    />
                  </svg>
                </button>
                <button
                  (click)="deleteArticle(article.id)"
                  class="p-2 rounded-xl text-[#424754] hover:text-red-500 hover:bg-red-50 border border-transparent hover:border-red-100 transition-all duration-200"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916"
                    />
                  </svg>
                </button>
              </div>
            </div>
          } @empty {
            <div class="p-20 text-center text-[#424754] text-lg">لا توجد مقالات حالياً</div>
          }
        </div>

        <!-- Footer -->
        <div class="flex items-center px-8 py-5 border-t border-gray-100 bg-[#f7f9fb]">
          <p class="text-sm text-[#424754] font-medium">
            إجمالي المقالات: {{ allArticles().length }}
          </p>
        </div>
      </div>
    </section>
  </main>
</div>
