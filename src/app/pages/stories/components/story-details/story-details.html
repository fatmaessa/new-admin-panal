٥<div class="min-h-screen bg-[#f7f9fb] p-5 md:p-8 lg:p-12" dir="rtl">
  <main class="max-w-3xl mx-auto space-y-8">
    <!-- Back -->
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-[#424754] font-bold hover:text-[#0058be] transition-colors duration-200 animate-[fadeSlideDown_0.5s_ease_both]"
    >
      <svg
        class="w-5 h-5 rotate-180"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
        />
      </svg>
      العودة للقصص
    </button>

    <!-- Loading -->
    @if (loading()) {
      <div class="flex justify-center items-center py-32">
        <div
          class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-[#0058be] animate-spin"
        ></div>
      </div>
    }

    @if (!loading() && story()) {
      <!-- Cover + Title -->
      <div
        class="bg-white rounded-[24px] overflow-hidden shadow-[0_8px_30px_rgba(59,130,246,0.08)] border border-blue-50 animate-[fadeSlideUp_0.5s_0.1s_ease_both]"
      >
        <div class="w-full h-56 md:h-72 overflow-hidden">
          <img [src]="story()!.url" [alt]="story()!.title" class="w-full h-full object-cover" />
        </div>
        <div class="p-8">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h1 class="text-[26px] font-bold text-[#191c1e] leading-[1.3] mb-2">
                {{ story()!.title }}
              </h1>
              <div class="flex gap-2 flex-wrap">
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-50 text-[#0058be]">
                  {{ story()!.category }}
                </span>
                <span
                  class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-600"
                >
                  ⭐ {{ story()!.pointsRewarded }} نقطة
                </span>
              </div>
            </div>

            <!-- Audio Player -->
            @if (story()!.audioUrl) {
              <button
                (click)="toggleAudio()"
                [class.bg-[#0058be]]="isPlaying()"
                [class.text-white]="isPlaying()"
                [class.bg-blue-50]="!isPlaying()"
                [class.text-[#0058be]]="!isPlaying()"
                class="flex items-center gap-2 px-5 py-3 rounded-2xl font-bold text-sm transition-all duration-200 hover:scale-105 active:scale-95 shrink-0"
              >
                @if (isPlaying()) {
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
                  </svg>
                  إيقاف الصوت
                } @else {
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                  </svg>
                  استمع للقصة
                }
              </button>
            }
          </div>
        </div>
      </div>

      <!-- Story Text -->
      <div
        class="bg-white rounded-[24px] p-8 shadow-[0_8px_30px_rgba(59,130,246,0.08)] border border-blue-50 animate-[fadeSlideUp_0.5s_0.2s_ease_both]"
      >
        <h2 class="text-lg font-bold text-[#191c1e] mb-4 flex items-center gap-2">
          <span class="w-8 h-8 rounded-xl bg-blue-50 flex items-center justify-center text-base"
            >📖</span
          >
          نص القصة
        </h2>
        <p class="text-[#424754] leading-[2] text-base whitespace-pre-line">
          {{ story()!.storyText }}
        </p>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-4 animate-[fadeSlideUp_0.5s_0.3s_ease_both]">
        <a
          [routerLink]="['/stories/edit', story()!.storyId]"
          class="flex-1 flex justify-center items-center gap-2 py-4 rounded-2xl text-white font-bold text-base bg-gradient-to-l from-[#3B82F6] to-[#60A5FA] shadow-[0_4px_12px_rgba(59,130,246,0.3)] hover:scale-[1.02] active:scale-95 transition-transform duration-200"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"
            />
          </svg>
          تعديل القصة
        </a>
        <button
          (click)="goBack()"
          class="px-8 py-4 rounded-2xl font-bold text-base bg-[#f2f4f6] text-[#424754] hover:bg-[#e6e8ea] active:scale-95 transition-all duration-200"
        >
          رجوع
        </button>
      </div>
    }
  </main>
</div>
