<!-- add-video.html -->
<main class="pt-24 px-6 max-w-3xl mx-auto min-h-screen">
  <header class="mb-10 text-center">
    <h1 class="text-3xl font-black text-slate-800 mb-2">
      {{ isEditMode() ? 'تعديل الفيديو' : 'إضافة فيديو جديد' }}
    </h1>
    <p class="text-slate-500">املأ البيانات بالأسفل لنشر فيديو جديد للأطفال</p>
  </header>

  <div class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50 border border-slate-100">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Title -->
      <div>
        <label class="block text-slate-700 font-bold mb-2 mr-2">عنوان الفيديو</label>
        <input
          type="text"
          formControlName="title"
          placeholder="مثلاً: رحلة في عالم الأرقام"
          class="w-full px-5 py-4 rounded-2xl border-2 transition-all outline-none focus:ring-4 focus:ring-blue-500/10 border-slate-100 focus:border-blue-500 text-slate-800"
        />
        <p
          *ngIf="form.get('title')?.invalid && form.get('title')?.touched"
          class="text-red-400 text-xs mt-1 mr-2"
        >
          العنوان مطلوب
        </p>
      </div>

      <!-- Category + Points -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-slate-700 font-bold mb-2 mr-2">تصنيف الفيديو</label>
          <select
            formControlName="category"
            class="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-500 outline-none transition-all text-slate-800 appearance-none bg-white"
          >
            <option value="" disabled selected>اختر التصنيف</option>
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
          <p
            *ngIf="form.get('category')?.invalid && form.get('category')?.touched"
            class="text-red-400 text-xs mt-1 mr-2"
          >
            التصنيف مطلوب
          </p>
        </div>

        <div>
          <label class="block text-slate-700 font-bold mb-2 mr-2">النقاط المكافئة</label>
          <input
            type="number"
            formControlName="pointsRewarded"
            placeholder="مثال: 50"
            class="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-500 outline-none transition-all text-slate-800"
          />
          <p
            *ngIf="form.get('pointsRewarded')?.invalid && form.get('pointsRewarded')?.touched"
            class="text-red-400 text-xs mt-1 mr-2"
          >
            النقاط مطلوبة وأكبر من 0
          </p>
        </div>
      </div>

      <!-- URL -->
      <div>
        <label class="block text-slate-700 font-bold mb-2 mr-2">رابط الفيديو</label>
        <input
          type="text"
          formControlName="url"
          placeholder="https://youtube.com/..."
          class="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-500 outline-none transition-all text-slate-800"
        />
        <p
          *ngIf="form.get('url')?.invalid && form.get('url')?.touched"
          class="text-red-400 text-xs mt-1 mr-2"
        >
          الرابط مطلوب
        </p>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-slate-700 font-bold mb-2 mr-2">وصف الفيديو</label>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="اكتب وصف الفيديو هنا..."
          class="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-500 outline-none transition-all text-slate-800 resize-none"
        ></textarea>
        <p
          *ngIf="form.get('description')?.invalid && form.get('description')?.touched"
          class="text-red-400 text-xs mt-1 mr-2"
        >
          الوصف مطلوب
        </p>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-4 pt-6">
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="flex-1 bg-gradient-to-r from-blue-400 to-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2 disabled:opacity-60"
        >
          <span class="material-symbols-outlined">save</span>
          {{
            isSubmitting() ? 'جاري الحفظ...' : isEditMode() ? 'حفظ التعديلات' : 'حفظ ونشر الفيديو'
          }}
        </button>
        <button
          type="button"
          (click)="onCancel()"
          class="px-8 py-4 rounded-2xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-all active:scale-95"
        >
          إلغاء
        </button>
      </div>
    </form>
  </div>
</main>
