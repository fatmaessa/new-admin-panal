<div class="min-h-screen bg-[#f7f9fb] p-5 md:p-8 lg:p-12" dir="rtl">
  <main class="max-w-5xl mx-auto space-y-8">
    <!-- Back + Actions -->
    <div class="flex justify-between items-center animate-[fadeSlideDown_0.5s_ease_both]">
      <div class="flex gap-3" *ngIf="!isLoading()">
        <button
          (click)="goToEdit()"
          class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-bold text-sm bg-gradient-to-l from-[#3B82F6] to-[#60A5FA] shadow-[0_4px_12px_rgba(59,130,246,0.3)] hover:scale-105 active:scale-95 transition-transform duration-200"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"
            />
          </svg>
          تعديل
        </button>
        <button
          (click)="confirmDelete()"
          class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-bold text-sm bg-gradient-to-l from-red-500 to-red-400 shadow-[0_4px_12px_rgba(239,68,68,0.3)] hover:scale-105 active:scale-95 transition-transform duration-200"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916"
            />
          </svg>
          حذف
        </button>
      </div>

      <button
        (click)="goBack()"
        class="flex items-center gap-2 text-[#424754] hover:text-[#0058be] transition-colors duration-200 font-bold"
      >
        العودة للمكتبة
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"
          />
        </svg>
      </button>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading()" class="flex justify-center items-center min-h-[400px]">
      <div
        class="w-12 h-12 rounded-full border-4 border-[#0058be] border-t-transparent animate-spin"
      ></div>
    </div>

    <!-- Content -->
    <ng-container *ngIf="!isLoading() && video()">
      <!-- Player -->
      <!-- Player -->
      <section class="animate-[fadeSlideUp_0.5s_0.1s_ease_both]">
        <div
          [class]="
            'relative w-full aspect-video md:aspect-[21/9] rounded-[24px] overflow-hidden flex items-center justify-center border-4 shadow-[0_8px_30px_rgba(59,130,246,0.15)] ' +
            getBorderClass()
          "
        >
          <!-- Thumbnail لو يوتيوب -->
          <img
            *ngIf="getYoutubeThumbnail()"
            [src]="getYoutubeThumbnail()!"
            class="absolute inset-0 w-full h-full object-cover"
            alt="thumbnail"
          />

          <!-- Fallback لو مش يوتيوب -->
          <div
            *ngIf="!getYoutubeThumbnail()"
            class="absolute inset-0 bg-[#f7f9fb] flex items-center justify-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="rgba(0,88,190,0.15)"
              class="w-24 h-24"
            >
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"
              />
            </svg>
          </div>

          <!-- Dark overlay عشان الـ play button يبان -->
          <div class="absolute inset-0 bg-black/30"></div>

          <!-- Play Button -->
          <a
            [href]="video()!.url"
            target="_blank"
            class="relative z-10 w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border-2 border-white/60 hover:scale-110 hover:bg-white/30 transition-all duration-200 active:scale-90"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="white"
              class="w-10 h-10 ml-1"
            >
              <path d="M8 5v14l11-7z" />
            </svg>
          </a>

          <!-- Category Badge -->
          <div
            class="absolute bottom-6 right-6 z-10 text-white text-sm font-bold bg-black/40 px-4 py-2 rounded-xl backdrop-blur-sm"
          >
            {{ video()!.category }}
          </div>
        </div>
      </section>

      <!-- Info Card -->
      <section
        class="bg-white rounded-[24px] p-8 shadow-[0_8px_30px_rgba(59,130,246,0.08)] border border-blue-50 animate-[fadeSlideUp_0.5s_0.2s_ease_both]"
      >
        <div class="flex justify-between items-start gap-4 mb-4">
          <h1 class="text-[24px] font-bold text-[#191c1e]">{{ video()!.title }}</h1>
          <span [class]="getCategoryClass(video()!.category)">{{ video()!.category }}</span>
        </div>

        <p class="text-[#424754] leading-relaxed mb-6">{{ video()!.description }}</p>

        <div class="flex gap-6 border-t border-gray-100 pt-6">
          <div class="flex items-center gap-2">
            <span class="text-amber-400">⭐</span>
            <span class="font-bold text-[#191c1e]">{{ video()!.pointsRewarded }}</span>
            <span class="text-sm text-[#424754]">نقطة</span>
          </div>
          <div class="flex items-center gap-2">
            <svg
              class="w-4 h-4 text-[#0058be]"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244"
              />
            </svg>
            <a
              [href]="video()!.url"
              target="_blank"
              class="text-sm text-[#0058be] underline underline-offset-2 truncate max-w-[200px]"
            >
              {{ video()!.url }}
            </a>
          </div>
        </div>
      </section>
    </ng-container>
  </main>
</div>

<!-- Delete Modal -->
<div
  *ngIf="showDeleteModal()"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm px-4"
  (click)="closeDeleteModal()"
>
  <div
    class="bg-white rounded-[24px] p-8 w-full max-w-sm shadow-2xl text-center border border-blue-50"
    (click)="$event.stopPropagation()"
  >
    <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <svg
        class="w-8 h-8 text-red-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916"
        />
      </svg>
    </div>
    <h2 class="text-xl font-bold text-[#191c1e] mb-2">حذف الفيديو؟</h2>
    <p class="text-[#424754] text-sm mb-8">هيتحذف الفيديو نهائياً ومش هتقدر ترجعه تاني.</p>
    <div class="flex gap-3" dir="rtl">
      <button
        (click)="submitDelete()"
        [disabled]="isDeleting()"
        class="flex-1 py-3 rounded-2xl font-bold text-white bg-gradient-to-l from-red-500 to-red-400 shadow-[0_4px_12px_rgba(239,68,68,0.3)] hover:scale-[1.02] active:scale-95 transition-transform duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ isDeleting() ? 'جاري الحذف...' : 'نعم، احذف' }}
      </button>
      <button
        (click)="closeDeleteModal()"
        class="flex-1 py-3 rounded-2xl font-bold bg-[#f2f4f6] text-[#424754] hover:bg-[#e6e8ea] active:scale-95 transition-all duration-200"
      >
        إلغاء
      </button>
    </div>
  </div>
</div>
