<div class="flex flex-row-reverse gap-3 overflow-x-auto pb-2" dir="rtl">
  <button
    *ngFor="let cat of categories"
    (click)="selectCategory(cat)"
    [class.bg-[#0058be]]="selectedCategory === cat"
    [class.text-white]="selectedCategory === cat"
    [class.bg-white]="selectedCategory !== cat"
    [class.text-[#424754]]="selectedCategory !== cat"
    class="whitespace-nowrap px-5 py-2 rounded-xl font-bold text-sm shadow-sm border border-blue-50 hover:border-[#0058be] hover:text-[#0058be] transition-all duration-200"
  >
    {{ cat }}
  </button>
</div>
