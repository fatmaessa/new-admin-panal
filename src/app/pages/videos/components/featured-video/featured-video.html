<section dir="rtl">
  <div
    (click)="navigateToDetails()"
    class="relative w-full aspect-video md:aspect-[21/9] rounded-[24px] overflow-hidden group shadow-[0_8px_30px_rgba(59,130,246,0.15)] cursor-pointer"
  >
    <!-- Gradient Background -->
    <div
      [class]="getGradient()"
      class="w-full h-full group-hover:scale-105 transition-transform duration-700"
    ></div>

    <!-- Dark Overlay -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"
    ></div>

    <!-- Play Button -->
    <div class="absolute inset-0 flex items-center justify-center">
      <div
        class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border-2 border-white/50 group-hover:scale-110 transition-transform duration-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="white"
          class="w-10 h-10 ml-1"
        >
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>
    </div>

    <!-- Info -->
    <div class="absolute bottom-0 right-0 p-8 text-white w-full text-right">
      <span
        class="bg-white/20 backdrop-blur-sm px-4 py-1 rounded-full text-xs font-bold mb-3 inline-block"
      >
        مميز الآن
      </span>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">{{ video().title }}</h2>
      <p class="text-white/80 max-w-lg">{{ video().description }}</p>
    </div>
  </div>
</section>
