<section dir="rtl">
  <div
    (click)="navigateToDetails()"
    [class]="
      'relative w-full aspect-video md:aspect-[21/9] rounded-[24px] overflow-hidden group border-4 bg-white shadow-[0_8px_30px_rgba(59,130,246,0.15)] cursor-pointer ' +
      getBorderClass()
    "
  >
    <!-- YouTube Thumbnail -->
    <img
      *ngIf="getYoutubeThumbnail()"
      [src]="getYoutubeThumbnail()!"
      class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
      alt="thumbnail"
    />

    <!-- Fallback لو مش يوتيوب -->
    <div
      *ngIf="!getYoutubeThumbnail()"
      class="w-full h-full bg-[#f7f9fb] group-hover:scale-105 transition-transform duration-700 flex items-center justify-center"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="rgba(0,88,190,0.08)"
        class="w-32 h-32"
      >
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"
        />
      </svg>
    </div>

    <!-- Dark Overlay -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent"
    ></div>

    <!-- Play Button -->
    <div class="absolute inset-0 flex items-center justify-center">
      <div
        class="w-20 h-20 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center border-2 border-[#0058be]/30 group-hover:scale-110 transition-transform duration-300 shadow-md"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="#0058be"
          class="w-10 h-10 ml-1"
        >
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>
    </div>

    <!-- Info -->
    <div class="absolute bottom-0 right-0 p-8 text-white w-full text-right">
      <span
        class="bg-white/20 backdrop-blur-sm px-4 py-1 rounded-full text-xs font-bold mb-3 inline-block"
      >
        مميز الآن
      </span>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">{{ video().title }}</h2>
      <p class="text-white/90 max-w-lg">{{ video().description }}</p>
    </div>
  </div>
</section>
