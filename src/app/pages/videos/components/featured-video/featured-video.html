<!-- featured-video.html -->
<section class="mb-10">
  <div
    class="relative w-full aspect-video md:aspect-[21/9] rounded-[32px] overflow-hidden group video-card-shadow"
  >
    <img
      [src]="video.thumbnail"
      [alt]="video.title"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
    />
    <div
      class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"
    ></div>
    <div class="absolute inset-0 flex items-center justify-center">
      <button
        class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white border-2 border-white/50 hover:scale-110 transition-transform active:scale-90"
      >
        <span class="material-symbols-outlined text-4xl">play_arrow</span>
      </button>
    </div>
    <div class="absolute bottom-0 right-0 p-8 text-white w-full text-right">
      <span
        class="bg-secondary-container text-on-secondary-container px-4 py-1 rounded-full text-xs font-bold mb-3 inline-block uppercase tracking-wider"
      >
        مميز الآن
      </span>
      <h2 class="text-2xl md:text-3xl font-h2-arabic mb-2">{{ video.title }}</h2>
      <p class="text-white/80 font-body-md-arabic max-w-lg mr-0 ml-auto">{{ video.description }}</p>
    </div>
  </div>
</section>
