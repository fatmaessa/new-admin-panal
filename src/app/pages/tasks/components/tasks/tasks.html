<main class="max-w-7xl mx-auto px-6 py-8 mt-5">

  <!-- Page Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="font-h1-arabic text-2xl font-bold text-slate-800">إدارة المهام</h1>
      <p class="text-outline text-sm mt-1">قم بإدارة وتعديل قائمة المهام المتاحة للأبطال</p>
    </div>
    <button (click)="addTask()"
      class="bg-linear-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2 shadow-lg shadow-primary/20 transition-all active:scale-95">
      <span>إضافة مهمة جديدة</span>
    </button>
  </div>

  <!-- Filters -->
  <app-tasks-filters (filterChanged)="onFilterChange($event)" />

  <!-- Table -->
  <app-tasks-table
    [tasks]="filteredTasks"
    (editTask)="onEditTask($event)"
    (deleteTask)="onDeleteTask($event)"
  />

</main>

<!-- FAB -->
<div class="fixed bottom-6 right-6 hidden md:block">
  <div class="bg-white p-2 rounded-full shadow-xl border border-slate-100">
    <button class="w-12 h-12 bg-primary text-white rounded-full flex items-center justify-center">
      <span class="material-symbols-outlined">support_agent</span>
    </button>
  </div>
</div>
