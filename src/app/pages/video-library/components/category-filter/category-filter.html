<div class="flex flex-row-reverse gap-3 overflow-x-auto pb-6">
  <button
    *ngFor="let cat of categories"
    (click)="selectCategory(cat)"
    [class]="selectedCategory === cat
      ? 'whitespace-nowrap px-6 py-2.5 rounded-full bg-primary text-on-primary font-bold shadow-md'
      : 'whitespace-nowrap px-6 py-2.5 rounded-full bg-white text-on-surface-variant font-bold border border-slate-100 hover:bg-blue-50 transition-colors'"
  >
    {{ cat }}
  </button>
</div>
