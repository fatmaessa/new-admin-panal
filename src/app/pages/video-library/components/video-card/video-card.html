<div class="flex flex-col group cursor-pointer">
  <div class="relative aspect-video rounded-3xl overflow-hidden mb-4 video-card-shadow">
    <img
      [src]="video.thumbnail"
      [alt]="video.title"
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
    />
    <div class="absolute bottom-3 left-3 bg-slate-900/70 text-white px-2 py-1 rounded-lg text-xs font-bold">
      {{ video.duration }}
    </div>
    <div class="absolute top-3 right-3">
      <span [class]="getCategoryClass()">
        {{ video.category }}
      </span>
    </div>
  </div>
  <h3 class="font-h2-arabic text-lg text-on-surface mb-1 text-right group-hover:text-primary transition-colors">
    {{ video.title }}
  </h3>
  <div class="flex flex-row-reverse items-center justify-between text-slate-500">
    <span class="text-sm font-label-sm-arabic">{{ video.timeAgo }}</span>
    <div class="flex items-center gap-1">
      <span class="text-sm">{{ video.views }}</span>
      <span class="material-symbols-outlined text-sm">visibility</span>
    </div>
  </div>
</div>
