<main class="pt-24 px-6 max-w-5xl mx-auto">

  <!-- Header -->
  <div class="flex flex-row-reverse justify-between items-center mb-8">
    <h1 class="font-h1-arabic text-h1-arabic text-primary">مكتبة الفيديوهات</h1>
    <button class="bg-gradient-to-r from-blue-400 to-blue-600 text-on-primary px-6 py-3 rounded-2xl flex items-center gap-2 shadow-lg hover:shadow-blue-200/50 transition-all active:scale-95">
      <span class="font-bold text-sm">إضافة فيديو</span>
    </button>
  </div>

  <!-- Category Filter -->
  <app-category-filter (categoryChanged)="onCategoryChange($event)" />

  <!-- Featured Video -->
  <app-featured-video [video]="featuredVideo" />

  <!-- Video Grid -->
  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <app-video-card
      *ngFor="let video of filteredVideos"
      [video]="video"
    />
  </section>

</main>
