<!-- Mobile Toggle Button -->
<button
  (click)="toggleMenu()"
  class="fixed top-4 right-4 z-50 md:hidden w-11 h-11 rounded-xl bg-gradient-to-b from-[#4ba7f2] to-[#8a4af3] flex items-center justify-center shadow-lg"
>
  <i [class]="isOpen() ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'" class="text-white text-xl"></i>
</button>

<!-- Overlay -->
<div
  (click)="toggleMenu()"
  [class.hidden]="!isOpen()"
  class="fixed inset-0 bg-black/40 z-30 md:hidden"
></div>

<!-- Sidebar -->
<aside
  [class.translate-x-0]="isOpen()"
  [class.translate-x-full]="!isOpen()"
  class="w-[240px] md:w-[18%] h-screen fixed right-0 top-0 z-40 bg-gradient-to-b from-[#4ba7f2] to-[#8a4af3] flex flex-col gap-10 px-2 transition-transform duration-300 md:translate-x-0"
>
  <div class="text-center w-full pt-4">
    <img src="logo_image.png" alt="" class="w-20 h-20 mx-auto" />
    <p
      class="text-center text-xl font-bold bg-gradient-to-b from-[#4e7391] to-[#38166e] bg-clip-text text-transparent"
    >
      ونيسي
    </p>
    <p class="text-white text-xl mt-3 font-bold">لوحة الادارة</p>
  </div>

  <ul class="flex flex-col gap-5 items-start">
    <li
      class="has-[.active]:bg-[#7aa8f5] has-[.active]:border-r-4 has-[.active]:border-white w-full rounded-lg pr-4 py-3"
    >
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        class="flex flex-row items-center"
      >
        <i class="fa-regular fa-house text-white text-xl ml-3"></i>
        <p class="text-white font-bold">الصفحة الرئيسية</p>
      </a>
    </li>
    <li
      class="has-[.active]:bg-[#7aa8f5] has-[.active]:border-r-4 has-[.active]:border-white w-full rounded-lg pr-4 py-3"
    >
      <a
        routerLink="/stories"
        routerLinkActive="active"
        (click)="closeMenu()"
        class="flex flex-row items-center"
      >
        <i class="fa-solid fa-book-open text-white text-xl ml-3"></i>
        <p class="text-white font-bold">القصص</p>
      </a>
    </li>
    <li
      class="has-[.active]:bg-[#7aa8f5] has-[.active]:border-r-4 has-[.active]:border-white w-full rounded-lg pr-4 py-3"
    >
      <a
        routerLink="/videos"
        routerLinkActive="active"
        (click)="closeMenu()"
        class="flex flex-row items-center"
      >
        <i class="fa-regular fa-circle-play text-white text-xl ml-3"></i>
        <p class="text-white font-bold">الفيديوهات</p>
      </a>
    </li>
    <li
      class="has-[.active]:bg-[#7aa8f5] has-[.active]:border-r-4 has-[.active]:border-white w-full rounded-lg pr-4 py-3"
    >
      <a
        routerLink="/tasks"
        routerLinkActive="active"
        (click)="closeMenu()"
        class="flex flex-row items-center"
      >
        <i class="fa-solid fa-list-check text-white text-xl ml-3"></i>
        <p class="text-white font-bold">المهام</p>
      </a>
    </li>
    <li
      class="has-[.active]:bg-[#7aa8f5] has-[.active]:border-r-4 has-[.active]:border-white w-full rounded-lg pr-4 py-3"
    >
      <a
        routerLink="/articles"
        routerLinkActive="active"
        (click)="closeMenu()"
        class="flex flex-row items-center"
      >
        <i class="fa-regular fa-newspaper text-white text-xl ml-3"></i>
        <p class="text-white font-bold">المقالات</p>
      </a>
    </li>
  </ul>
</aside>
